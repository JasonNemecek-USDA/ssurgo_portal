[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssurgo-portal"
version = "0.1.0"
description = "SSURGO Portal helper utilities"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "SSURGO Portal Contributors"}]
keywords = ["ssurgo", "usda", "download"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only"
]

[project.urls]
Homepage = "https://www.nrcs.usda.gov/resources/data-and-reports/ssurgo-portal"

[project.scripts]
ssurgo-download = "ssurgo_portal.cli:main"
ssurgo-version = "ssurgo_portal.cli:print_version"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
